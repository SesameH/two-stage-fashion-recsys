[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned so CI and a local run agree; a lint gate that only fails in CI gets disabled.
select = ["E", "F", "W", "I", "UP", "B", "C4", "ISC"]
ignore = [
  "E501",   # line length is handled by the formatter, not by failing the build
  "B008",   # FastAPI's Query()/Depends() in defaults is the documented pattern
  "B905",   # zip(strict=) — every zip here pairs columns of one DataFrame, equal by construction
]
